<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ifram연습</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            li {
                list-style: none;
            }
            a {
                text-decoration: none;
                color: aqua;
            }
            #wrap {
                width: 1000px;
                margin: 0 auto;
                background-color: aqua;
            }
            ul {
                height: 80px;
                display: flex;
            }
            li {
                width: 20%;
                font-size: 20px;
                font-weight: bold;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            li:nth-child(1) {
                background-color: aqua;
            }
            li:nth-child(2) {
                background-color: red;
            }
            li:nth-child(3) {
                background-color: blue;
            }

            .iframe_inner {
                width: 100%;
                height: 600px;
                background-color: aquamarine;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <ul>
                <li><a href="../iframe/aqua.html" target="">menu01</a></li>
                <li><a href="../iframe/red.html" target="">menu02</a></li>
                <li><a href="../iframe/blue.html" target="">menu03</a></li>
            </ul>
            <div class="iframe_inner">
                <iframe src="" frameborder="1" width="100%" name="color"></iframe>
            </div>
        </div>
    </body>
</html>
